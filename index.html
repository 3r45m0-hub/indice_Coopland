<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora Coopland - IMSS</title>
    
    <!-- Librerías de React (Versión UMD para navegadores sin empaquetador) -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    
    <!-- Babel para compilar JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- Script de configuración de Babel para evitar el error de módulos (runtime: classic) -->
    <script>
        Babel.registerPreset('react-classic', {
            presets: [
                [Babel.availablePresets['react'], { "runtime": "classic" }]
            ]
        });
    </script>
    
    <!-- Tailwind CSS para el diseño -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- FontAwesome para los íconos médicos -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-100">
    <div id="root"></div>

    <!-- Se elimina data-type="module" y se usa nuestro preset personalizado "react-classic" -->
    <script type="text/babel" data-presets="react-classic">
        const { useState, useMemo } = React;

        // =====================================================================
        // ⚙️ CONFIGURACIÓN DE GOOGLE FORMS
        // =====================================================================
        const GOOGLE_FORM_URL = "https://docs.google.com/forms/d/e/1FAIpQLSd99NwHhxgG3uYtB53VuNO-NZZeosPdY5JKhaV3QrykH96KLw/formResponse";
        const FORM_ENTRIES = {
            unidad: "entry.1117169880",
            puntaje: "entry.1765886643",
            riesgo: "entry.1685328153"
        };
        // =====================================================================

        const unidadesMedicas = [
            "HGZMF 2 San Luis Potosí", "UMF 51 María Cecilia", "HR Axtla De Terrazas", 
            "HGZMF 1 San Luis Potosí", "UMF 49 San Luis Potosí", "UMF 45 San Luis Potosí", 
            "UMF 47 San Luis Potosí", "HGZ 50 Tangamanga", "UMF 5 Soledad Graciano", 
            "UMF 10 Matehuala", "UMF 8 Cd. Maíz", "HGZ 6 Cd. Valles", "UMF 3 Cd. Valles", 
            "UMF 13 El Tamuin", "UMFH 12 Tamasopo", "HGSMF 9 Río Verde", "HGSMF 4 El Naranjo", 
            "HR Zacatipan", "UMF 48 La Hincada", "UMF 20 V. Reyes", "UMF 7 Morales", 
            "HR Cerritos", "UMFH 11 Rascón", "UMF 26 Cárdenas", "HR Matehuala", 
            "UMF 23 Cerritos", "HR Charcas", "UMF 31 Cd. Santos", "UMF 24 Ebano", 
            "HR Los Hernandez", "UMF 16 S. Hidalgo", "UMF 34 Tampamolon", "UMF 30 Tanlajas", 
            "UMF 29 Aquismon", "UMF 19 S. María Río", "UMF 40 Venado", "UMF 42 Moctezuma", 
            "UMF 35 V. Alfredo M.", "UMF 21 V. Zaragoza", "UMF 22 Guadalcazar", 
            "UMF 37 Tamazunchale", "UMF 43 Cedral", "UMF 46 Venegas"
        ];

        const sections = [
            {
                title: "Datos Generales (Factor de Riesgo)",
                icon: "fa-solid fa-user",
                items: [
                    { id: 'edad', label: 'Edad', type: 'radio', options: [{ label: 'Entre 18 y 35 años', value: 0 }, { label: 'Menos de 18 años', value: 2 }, { label: 'Más de 35 años', value: 2 }] },
                    { id: 'paridad', label: 'Paridad', type: 'radio', options: [{ label: '1 - 4', value: 0 }, { label: 'Nulípara', value: 1 }, { label: '> 5', value: 2 }] }
                ]
            },
            {
                title: "Condiciones Médicas y Quirúrgicas",
                icon: "fa-solid fa-heart-pulse",
                items: [
                    { id: 'hta_cronica', label: 'Hipertensión Arterial Crónica', type: 'checkbox', value: 2 },
                    { id: 'dm_pregestacional', label: 'Diabetes Pregestacional', type: 'checkbox', value: 2 },
                    { id: 'enf_renal', label: 'Enfermedad Renal Crónica', type: 'checkbox', value: 2 },
                    { id: 'cirugia_gine', label: 'Cirugía Ginecológica previa', type: 'checkbox', value: 2 },
                    { id: 'cardiopatia', label: 'Cardiopatía', type: 'radio', options: [{ label: 'Ninguna', value: 0 }, { label: 'NYHA I o II', value: 1 }, { label: 'NYHA III o IV', value: 3 }] },
                    { id: 'otras_med', label: 'Cualquier padecimiento médico (asma, epilepsia, Tb, autoinmune, etc.)', type: 'radio', options: [{ label: 'Ninguno', value: 0 }, { label: 'Leve (1 pto)', value: 1 }, { label: 'Moderado (2 ptos)', value: 2 }, { label: 'Severo (3 ptos)', value: 3 }] }
                ]
            },
            {
                title: "Antecedentes Obstétricos",
                icon: "fa-solid fa-clipboard-list",
                items: [
                    { id: 'infertilidad', label: 'Infertilidad', type: 'checkbox', value: 1 },
                    { id: 'abortos_1', label: 'Dos o más abortos del primer trimestre', type: 'checkbox', value: 1 },
                    { id: 'abortos_2', label: 'Dos o más abortos del segundo trimestre', type: 'checkbox', value: 2 },
                    { id: 'peso_previo', label: 'Algún RN menor a 2500 g o mayor a 4000 g de peso al nacimiento', type: 'checkbox', value: 1 },
                    { id: 'cesarea_previa', label: 'Cesárea previa', type: 'checkbox', value: 1 },
                    { id: 'hpp', label: 'Hemorragia postparto o alumbramiento manual', type: 'checkbox', value: 1 },
                    { id: 'muerte_perinatal', label: 'Muerte fetal o muerte neonatal', type: 'checkbox', value: 3 },
                    { id: 'distocia', label: 'Distocia o trabajo de parto prolongado', type: 'checkbox', value: 2 },
                    { id: 'preeclampsia_previa', label: 'Hipertensión gestacional o preeclampsia', type: 'checkbox', value: 2 },
                    { id: 'eclampsia_previa', label: 'Eclampsia', type: 'checkbox', value: 3 },
                    { id: 'dm_gest_previa', label: 'Diabetes Gestacional', type: 'checkbox', value: 2 }
                ]
            },
            {
                title: "Condiciones en el Embarazo Actual",
                icon: "fa-solid fa-baby",
                items: [
                    { id: 'sangrado_20', label: 'Sangrado vaginal antes de 20 semanas', type: 'checkbox', value: 1 },
                    { id: 'sangrado_post_20', label: 'Sangrado vaginal después de 20 semanas', type: 'checkbox', value: 3 },
                    { id: 'aloinmunizacion', label: 'Aloinmunización Rh', type: 'checkbox', value: 3 },
                    { id: 'presentacion_anomala', label: 'No presentación cefálica al término', type: 'checkbox', value: 3 },
                    { id: 'hta_actual', label: 'Hipertensión', type: 'checkbox', value: 3 },
                    { id: 'eclampsia_actual', label: 'Eclampsia', type: 'checkbox', value: 3 },
                    { id: 'dm_gest_actual', label: 'Diabetes Gestacional', type: 'checkbox', value: 2 },
                    { id: 'placenta_previa', label: 'Placenta previa', type: 'checkbox', value: 2 },
                    { id: 'polihidramnios', label: 'Polihidramnios', type: 'checkbox', value: 2 },
                    { id: 'oligohidramnios', label: 'Oligohidramnios', type: 'checkbox', value: 2 },
                    { id: 'rciu', label: 'Peso fetal menor percentil 10 para edad gestacional', type: 'checkbox', value: 3 },
                    { id: 'doppler_anormal', label: 'Ultrasonido Doppler fetoplacentario anormal', type: 'checkbox', value: 3 },
                    { id: 'anemia', label: 'Anemia', type: 'radio', options: [{ label: 'Normal (Hb > 10 g/L)', value: 0 }, { label: 'Hb 6-10 g/L', value: 1 }, { label: 'Hb menor 6 g/L', value: 2 }] },
                    { id: 'rpm', label: 'Ruptura Prematura de Membranas', type: 'radio', options: [{ label: 'Ninguna', value: 0 }, { label: 'Ruptura prematura de membranas', value: 2 }, { label: 'Ruptura prematura de membranas pretérmino', value: 3 }] }
                ]
            }
        ];

        const initialValues = { edad: 0, paridad: 0, cardiopatia: 0, otras_med: 0, anemia: 0, rpm: 0 };

        function App() {
            const [values, setValues] = useState({ ...initialValues });
            const [patientData, setPatientData] = useState({
                unidad: '',
                fecha: new Date().toISOString().split('T')[0],
                peso: '',
                talla: '',
            });
            const [isSubmitting, setIsSubmitting] = useState(false);
            const [submitStatus, setSubmitStatus] = useState(null);

            const toggleCheckbox = (id, value) => setValues(prev => ({ ...prev, [id]: prev[id] ? undefined : value }));
            const handleRadio = (id, value) => setValues(prev => ({ ...prev, [id]: value }));

            const handlePatientDataChange = (e) => {
                const { name, value } = e.target;
                setPatientData(prev => ({ ...prev, [name]: value }));
                if (submitStatus) {
                    setSubmitStatus(null);
                }
            };

            const resetForm = () => {
                setValues({ ...initialValues });
                setPatientData(prev => ({ ...prev, peso: '', talla: '' }));
                setSubmitStatus(null);
                window.scrollTo({ top: 0, behavior: 'smooth' });
            };

            const imc = useMemo(() => {
                const p = parseFloat(patientData.peso);
                const t = parseFloat(patientData.talla);
                if (p > 0 && t > 0) {
                    const heightInMeters = t > 3 ? t / 100 : t; 
                    return (p / (heightInMeters * heightInMeters)).toFixed(1);
                }
                return '';
            }, [patientData.peso, patientData.talla]);

            const totalScore = useMemo(() => {
                let sum = 0;
                Object.values(values).forEach(val => { if (typeof val === 'number') sum += val; });
                return sum;
            }, [values]);

            const risk = useMemo(() => {
                if (totalScore <= 3) return { label: 'Riesgo Bajo', color: 'text-green-700', bg: 'bg-green-100', border: 'border-green-500', bar: 'bg-green-500' };
                if (totalScore <= 6) return { label: 'Riesgo Moderado', color: 'text-yellow-700', bg: 'bg-yellow-100', border: 'border-yellow-500', bar: 'bg-yellow-500' };
                return { label: 'Riesgo Alto', color: 'text-red-700', bg: 'bg-red-100', border: 'border-red-500', bar: 'bg-red-500' };
            }, [totalScore]);

            const saveRecord = async () => {
                if (!patientData.unidad) {
                    alert("⚠️ Por favor, seleccione una Unidad Médica en la parte superior antes de guardar.");
                    return;
                }

                setIsSubmitting(true);
                setSubmitStatus(null);

                try {
                    const formData = new URLSearchParams();
                    formData.append(FORM_ENTRIES.unidad, patientData.unidad);
                    formData.append(FORM_ENTRIES.puntaje, totalScore);
                    formData.append(FORM_ENTRIES.riesgo, risk.label);

                    await fetch(GOOGLE_FORM_URL, {
                        method: 'POST',
                        mode: 'no-cors',
                        headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                        body: formData.toString()
                    });

                    setSubmitStatus('success');
                    setTimeout(() => {
                        setSubmitStatus(null);
                        resetForm();
                    }, 3500);

                } catch (error) {
                    console.error('Error:', error);
                    alert("Hubo un problema al guardar. Verifique su conexión.");
                } finally {
                    setIsSubmitting(false);
                }
            };

            return (
                <div className="min-h-screen text-slate-800 font-sans pb-28 md:pb-10">
                    <header className="bg-[#005c5c] text-white p-5 shadow-lg border-b-4 border-[#004242]">
                        <div className="max-w-6xl mx-auto">
                            <div className="flex flex-col md:flex-row items-center md:items-start justify-between">
                                <div className="flex items-center mb-4 md:mb-0">
                                    <div className="bg-white p-2 rounded-full mr-4 shadow-sm flex items-center justify-center w-12 h-12">
                                        <div className="w-full h-full bg-[#005c5c] rounded-full flex items-center justify-center">
                                            <span className="text-white font-black text-sm">IMSS</span>
                                        </div>
                                    </div>
                                    <div>
                                        <h1 className="text-xl md:text-2xl font-bold leading-tight">Instituto Mexicano del Seguro Social</h1>
                                        <p className="text-teal-100 text-sm font-medium">OOAD San Luis Potosí</p>
                                        <p className="text-teal-100 text-xs mt-0.5 opacity-90">Jefatura de Servicios de Prestaciones Médicas</p>
                                    </div>
                                </div>
                                <div className="text-center md:text-right">
                                    <h2 className="text-lg font-bold bg-[#004242] px-4 py-2 rounded-lg inline-block shadow-inner">
                                        Índice de Coopland
                                    </h2>
                                </div>
                            </div>
                        </div>
                    </header>

                    <main className="max-w-6xl mx-auto p-4 md:p-6 grid grid-cols-1 md:grid-cols-12 gap-6 mt-2">
                        <div className="md:col-span-8 space-y-6">
                            
                            {/* Ficha de Identificación */}
                            <section className="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden">
                                <div className="bg-[#f0f7f7] p-4 border-b border-[#005c5c]/10 flex items-center">
                                    <i className="fa-solid fa-hospital text-[#005c5c] mr-3 text-lg"></i>
                                    <h2 className="text-lg font-bold text-[#005c5c]">Datos de Evaluación</h2>
                                </div>
                                <div className="p-5 grid grid-cols-1 sm:grid-cols-2 gap-4">
                                    <div className="sm:col-span-2">
                                        <label className="block text-sm font-semibold text-slate-700 mb-1">Unidad Médica *</label>
                                        <select name="unidad" value={patientData.unidad} onChange={handlePatientDataChange} className="w-full p-2.5 border border-slate-300 rounded-lg focus:ring-2 focus:ring-[#005c5c] focus:border-[#005c5c] bg-slate-50">
                                            <option value="">-- Seleccione una unidad --</option>
                                            {unidadesMedicas.map((u, i) => <option key={i} value={u}>{u}</option>)}
                                        </select>
                                    </div>
                                    <div>
                                        <label className="block text-sm font-semibold text-slate-700 mb-1">Fecha</label>
                                        <input type="date" name="fecha" value={patientData.fecha} onChange={handlePatientDataChange} className="w-full p-2.5 border border-slate-300 rounded-lg focus:ring-2 focus:ring-[#005c5c] bg-slate-50"/>
                                    </div>
                                    <div>
                                        <label className="block text-sm font-semibold text-slate-700 mb-1">Peso (kg)</label>
                                        <input type="number" name="peso" placeholder="Ej. 65" value={patientData.peso} onChange={handlePatientDataChange} className="w-full p-2.5 border border-slate-300 rounded-lg focus:ring-2 focus:ring-[#005c5c] bg-slate-50"/>
                                    </div>
                                    <div>
                                        <label className="block text-sm font-semibold text-slate-700 mb-1">Talla (cm o m)</label>
                                        <input type="number" step="0.01" name="talla" placeholder="Ej. 160" value={patientData.talla} onChange={handlePatientDataChange} className="w-full p-2.5 border border-slate-300 rounded-lg focus:ring-2 focus:ring-[#005c5c] bg-slate-50"/>
                                    </div>
                                    <div>
                                        <label className="block text-sm font-semibold text-slate-700 mb-1">IMC</label>
                                        <div className="w-full p-2.5 bg-slate-100 border border-slate-200 rounded-lg text-slate-700 font-bold">{imc ? `${imc}` : '-'}</div>
                                    </div>
                                </div>
                            </section>

                            {/* Secciones Dinámicas */}
                            {sections.map((section, idx) => (
                                <section key={idx} className="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden">
                                    <div className="bg-[#f0f7f7] p-4 border-b border-[#005c5c]/10 flex items-center">
                                        <i className={`${section.icon} text-[#005c5c] mr-3 text-lg`}></i>
                                        <h2 className="text-lg font-bold text-[#005c5c]">{section.title}</h2>
                                    </div>
                                    <div className="p-5">
                                        {section.items.map(item => (
                                            <div key={item.id} className="mb-4 last:mb-0">
                                                {item.type === 'radio' ? (
                                                    <div className="bg-slate-50 p-4 rounded-xl border border-slate-100">
                                                        <div className="font-semibold text-slate-700 mb-3">{item.label}</div>
                                                        <div className="grid grid-cols-1 sm:grid-cols-3 gap-2">
                                                            {item.options.map(opt => {
                                                                const isSelected = values[item.id] === opt.value;
                                                                return (
                                                                    <button key={opt.label} type="button" onClick={() => handleRadio(item.id, opt.value)} className={`flex flex-col items-start p-3 border rounded-xl transition-all duration-200 ${isSelected ? 'bg-teal-50 border-[#005c5c] shadow-sm ring-1 ring-[#005c5c]' : 'bg-white hover:bg-slate-100 border-slate-200'}`}>
                                                                        <span className={`font-medium text-sm text-left ${isSelected ? 'text-[#005c5c]' : 'text-slate-700'}`}>{opt.label}</span>
                                                                        <span className={`text-xs font-bold mt-1 ${isSelected ? 'text-teal-700' : 'text-slate-400'}`}>{opt.value === 0 ? '0 puntos' : `+${opt.value} pto${opt.value > 1 ? 's' : ''}`}</span>
                                                                    </button>
                                                                );
                                                            })}
                                                        </div>
                                                    </div>
                                                ) : (
                                                    <button type="button" onClick={() => toggleCheckbox(item.id, item.value)} className={`w-full flex items-center justify-between p-3.5 border rounded-xl transition-all duration-200 ${values[item.id] ? 'bg-teal-50 border-[#005c5c] shadow-sm ring-1 ring-[#005c5c]' : 'bg-white hover:bg-slate-50 border-slate-200'}`}>
                                                        <div className="flex items-center">
                                                            <div className={`w-5 h-5 rounded flex items-center justify-center border mr-3 transition-colors shrink-0 ${values[item.id] ? 'bg-[#005c5c] border-[#005c5c]' : 'bg-white border-slate-300'}`}>
                                                                {values[item.id] && <i className="fa-solid fa-check text-white text-xs"></i>}
                                                            </div>
                                                            <span className={`font-medium text-sm text-left ${values[item.id] ? 'text-[#005c5c]' : 'text-slate-700'}`}>{item.label}</span>
                                                        </div>
                                                        <span className={`text-sm font-bold whitespace-nowrap ml-4 ${values[item.id] ? 'text-teal-700' : 'text-slate-400'}`}>+{item.value}</span>
                                                    </button>
                                                )}
                                            </div>
                                        ))}
                                    </div>
                                </section>
                            ))}
                        </div>

                        {/* Columna Lateral - Desktop */}
                        <div className="md:col-span-4 hidden md:block">
                            <div className="sticky top-6 bg-white p-6 rounded-2xl border border-slate-200 shadow-sm">
                                <h3 className="text-lg font-bold mb-4 text-[#005c5c] flex items-center border-b pb-3">
                                    <i className="fa-solid fa-calculator mr-2"></i> Puntaje Total
                                </h3>
                                
                                <div className="text-center mb-6 pt-2 pb-2">
                                    <div className="text-7xl font-black mb-1 text-slate-800">{totalScore}</div>
                                    <div className="text-slate-500 uppercase tracking-widest text-xs font-bold">Puntos Obtenidos</div>
                                </div>

                                <div className={`text-center py-4 rounded-xl font-bold mb-6 border-2 transition-colors duration-300 ${risk.bg} ${risk.color} ${risk.border}`}>
                                    {risk.label}
                                </div>
                                
                                <button onClick={saveRecord} disabled={isSubmitting} className={`w-full py-3.5 mb-3 font-bold rounded-xl transition-all flex items-center justify-center border shadow-sm ${submitStatus === 'success' ? 'bg-green-600 text-white border-green-700' : 'bg-[#005c5c] hover:bg-[#004242] text-white border-[#004242]'} disabled:opacity-70 disabled:cursor-not-allowed`}>
                                    {isSubmitting ? <span className="animate-pulse">Guardando...</span> : submitStatus === 'success' ? <><i className="fa-solid fa-circle-check mr-2"></i> ¡Guardado!</> : <><i className="fa-solid fa-floppy-disk mr-2"></i> Guardar Registro</>}
                                </button>

                                <button onClick={resetForm} className="w-full py-3.5 bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold rounded-xl transition-colors flex items-center justify-center border border-slate-200">
                                    <i className="fa-solid fa-rotate-left mr-2"></i> Limpiar Formulario
                                </button>
                            </div>
                        </div>
                    </main>

                    {/* Panel Inferior Flotante - Móvil */}
                    <div className="fixed bottom-0 left-0 right-0 bg-white border-t border-slate-200 shadow-[0_-8px_20px_-10px_rgba(0,0,0,0.1)] md:hidden z-50 transition-all">
                        <div className={`h-1.5 w-full ${risk.bar}`}></div>
                        <div className="p-4 flex justify-between items-center">
                            <div className="flex items-center">
                                <div className={`w-12 h-12 flex items-center justify-center rounded-full font-black text-xl mr-3 border-2 ${risk.bg} ${risk.color} ${risk.border}`}>
                                    {totalScore}
                                </div>
                                <div>
                                    <div className="text-[10px] text-slate-500 font-bold uppercase tracking-wider">Resultado</div>
                                    <div className={`font-bold ${risk.color}`}>{risk.label}</div>
                                </div>
                            </div>
                            <div className="flex gap-2">
                                <button onClick={resetForm} className="p-3 bg-slate-100 text-slate-600 rounded-xl active:bg-slate-200 border border-slate-200"><i className="fa-solid fa-rotate-left"></i></button>
                                <button onClick={saveRecord} disabled={isSubmitting} className={`px-4 py-3 font-bold rounded-xl flex items-center ${submitStatus === 'success' ? 'bg-green-600 text-white' : 'bg-[#005c5c] text-white active:bg-[#004242]'}`}>
                                    {isSubmitting ? '...' : submitStatus === 'success' ? <i className="fa-solid fa-circle-check"></i> : <i className="fa-solid fa-floppy-disk"></i>}
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
