<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, interactive-widget=resizes-content, viewport-fit=cover" />
  <title>Índice de Coopland – IMSS OOAD SLP</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    body { font-family: ui-sans-serif, system-ui, sans-serif; }
    .animate-pulse { animation: pulse 2s cubic-bezier(0.4,0,0.6,1) infinite; }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.5} }
  </style>
</head>
<body class="bg-slate-100">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useMemo } = React;

    // =====================================================================
    // ⚙️ CONFIGURACIÓN DE GOOGLE SHEETS / FORMS
    // =====================================================================
    const GOOGLE_FORM_URL = "https://docs.google.com/forms/d/e/1FAIpQLSd99NwHhxgG3uYtB53VuNO-NZZeosPdY5JKhaV3QrykH96KLw/formResponse";
    const FORM_ENTRIES = {
      unidad: "entry.1117169880",
      puntaje: "entry.1765886643",
      riesgo:  "entry.1685328153"
    };
    // =====================================================================

    // ── Iconos SVG inline (reemplazan lucide-react) ──────────────────────
    const Icon = ({ d, size = 20, className = "" }) => (
      <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size}
        viewBox="0 0 24 24" fill="none" stroke="currentColor"
        strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"
        className={className}>
        {Array.isArray(d) ? d.map((p, i) => <path key={i} d={p} />) : <path d={d} />}
      </svg>
    );

    const icons = {
      Calculator:    "M4 2h16a2 2 0 0 1 2 2v16a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2zM9 7H7v2h2V7zm0 4H7v2h2v-2zm0 4H7v2h2v-2zm8-8h-6v2h6V7zm0 4h-6v2h6v-2zm0 4h-6v2h6v-2z",
      RotateCcw:     ["M3 2v6h6","M3 13a9 9 0 1 0 3-7.7L3 8"],
      User:          ["M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2","M12 3a4 4 0 1 0 0 8 4 4 0 0 0 0-8z"],
      Activity:      "M22 12h-4l-3 9L9 3l-3 9H2",
      ClipboardList: ["M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2","M9 2h6v4H9z","M9 12h6M9 16h4"],
      Baby:          ["M9 12h.01M15 12h.01M10 16c.5.3 1.2.5 2 .5s1.5-.2 2-.5","M12 2a5 5 0 0 1 5 5v1a7 7 0 0 1-7 7 7 7 0 0 1-7-7V7a5 5 0 0 1 5-5z","M8 7a4 4 0 0 0 8 0"],
      Check:         "M20 6L9 17l-5-5",
      Building2:     ["M6 22V4a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v18","M6 12H4a2 2 0 0 0-2 2v6a2 2 0 0 0 2 2h2","M18 9h2a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2h-2","M10 6h4M10 10h4M10 14h4M10 18h4"],
      Save:          ["M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z","M17 21v-8H7v8","M7 3v5h8"],
      CheckCircle2:  ["M12 22a10 10 0 1 0 0-20 10 10 0 0 0 0 20z","M7.5 12l3 3 6-6"],
    };

    const Ico = ({ name, size = 20, className = "" }) => {
      const d = icons[name];
      return d ? <Icon d={d} size={size} className={className} /> : null;
    };

    // ── Datos ──────────────────────────────────────────────────────────────
    const unidadesMedicas = [
      "HGZMF 2 San Luis Potosí","UMF 51 María Cecilia","HR Axtla De Terrazas",
      "HGZMF 1 San Luis Potosí","UMF 49 San Luis Potosí","UMF 45 San Luis Potosí",
      "UMF 47 San Luis Potosí","HGZ 50 Tangamanga","UMF 5 Soledad Graciano",
      "UMF 10 Matehuala","UMF 8 Cd. Maíz","HGZ 6 Cd. Valles","UMF 3 Cd. Valles",
      "UMF 13 El Tamuin","UMFH 12 Tamasopo","HGSMF 9 Río Verde","HGSMF 4 El Naranjo",
      "HR Zacatipan","UMF 48 La Hincada","UMF 20 V. Reyes","UMF 7 Morales",
      "HR Cerritos","UMFH 11 Rascón","UMF 26 Cárdenas","HR Matehuala",
      "UMF 23 Cerritos","HR Charcas","UMF 31 Cd. Santos","UMF 24 Ebano",
      "HR Los Hernandez","UMF 16 S. Hidalgo","UMF 34 Tampamolon","UMF 30 Tanlajas",
      "UMF 29 Aquismon","UMF 19 S. María Río","UMF 40 Venado","UMF 42 Moctezuma",
      "UMF 35 V. Alfredo M.","UMF 21 V. Zaragoza","UMF 22 Guadalcazar",
      "UMF 37 Tamazunchale","UMF 43 Cedral","UMF 46 Venegas"
    ];

    const sections = [
      {
        title: "Datos Generales (Factor de Riesgo)", icon: "User",
        items: [
          { id:'edad', label:'Edad', type:'radio', options:[
            {label:'Entre 18 y 35 años',value:0},{label:'Menos de 18 años',value:2},{label:'Más de 35 años',value:2}
          ]},
          { id:'paridad', label:'Paridad', type:'radio', options:[
            {label:'1 - 4',value:0},{label:'Nulípara',value:1},{label:'> 5',value:2}
          ]}
        ]
      },
      {
        title: "Condiciones Médicas y Quirúrgicas", icon: "Activity",
        items: [
          {id:'hta_cronica',      label:'Hipertensión Arterial Crónica',      type:'checkbox', value:2},
          {id:'dm_pregestacional',label:'Diabetes Pregestacional',             type:'checkbox', value:2},
          {id:'enf_renal',        label:'Enfermedad Renal Crónica',            type:'checkbox', value:2},
          {id:'cirugia_gine',     label:'Cirugía Ginecológica previa',         type:'checkbox', value:2},
          { id:'cardiopatia', label:'Cardiopatía', type:'radio', options:[
            {label:'Ninguna',value:0},{label:'NYHA I o II',value:1},{label:'NYHA III o IV',value:3}
          ]},
          { id:'otras_med', label:'Cualquier padecimiento médico (asma, epilepsia, Tb, autoinmune, etc.)', type:'radio', options:[
            {label:'Ninguno',value:0},{label:'Leve (1 pto)',value:1},{label:'Moderado (2 ptos)',value:2},{label:'Severo (3 ptos)',value:3}
          ]}
        ]
      },
      {
        title: "Antecedentes Obstétricos", icon: "ClipboardList",
        items: [
          {id:'infertilidad',        label:'Infertilidad',                                                        type:'checkbox',value:1},
          {id:'abortos_1',           label:'Dos o más abortos del primer trimestre',                              type:'checkbox',value:1},
          {id:'abortos_2',           label:'Dos o más abortos del segundo trimestre',                             type:'checkbox',value:2},
          {id:'peso_previo',         label:'Algún RN menor a 2500 g o mayor a 4000 g de peso al nacimiento',     type:'checkbox',value:1},
          {id:'cesarea_previa',      label:'Cesárea previa',                                                      type:'checkbox',value:1},
          {id:'hpp',                 label:'Hemorragia postparto o alumbramiento manual',                         type:'checkbox',value:1},
          {id:'muerte_perinatal',    label:'Muerte fetal o muerte neonatal',                                      type:'checkbox',value:3},
          {id:'distocia',            label:'Distocia o trabajo de parto prolongado',                              type:'checkbox',value:2},
          {id:'preeclampsia_previa', label:'Hipertensión gestacional o preeclampsia',                             type:'checkbox',value:2},
          {id:'eclampsia_previa',    label:'Eclampsia',                                                           type:'checkbox',value:3},
          {id:'dm_gest_previa',      label:'Diabetes Gestacional',                                                type:'checkbox',value:2}
        ]
      },
      {
        title: "Condiciones en el Embarazo Actual", icon: "Baby",
        items: [
          {id:'sangrado_20',         label:'Sangrado vaginal antes de 20 semanas',                               type:'checkbox',value:1},
          {id:'sangrado_post_20',    label:'Sangrado vaginal después de 20 semanas',                             type:'checkbox',value:3},
          {id:'aloinmunizacion',     label:'Aloinmunización Rh',                                                 type:'checkbox',value:3},
          {id:'presentacion_anomala',label:'No presentación cefálica al término',                                type:'checkbox',value:3},
          {id:'hta_actual',          label:'Hipertensión',                                                       type:'checkbox',value:3},
          {id:'eclampsia_actual',    label:'Eclampsia',                                                          type:'checkbox',value:3},
          {id:'dm_gest_actual',      label:'Diabetes Gestacional',                                               type:'checkbox',value:2},
          {id:'placenta_previa',     label:'Placenta previa',                                                    type:'checkbox',value:2},
          {id:'polihidramnios',      label:'Polihidramnios',                                                     type:'checkbox',value:2},
          {id:'oligohidramnios',     label:'Oligohidramnios',                                                    type:'checkbox',value:2},
          {id:'rciu',                label:'Peso fetal menor percentil 10 para edad gestacional',                type:'checkbox',value:3},
          {id:'doppler_anormal',     label:'Ultrasonido Doppler fetoplacentario anormal',                        type:'checkbox',value:3},
          { id:'anemia', label:'Anemia', type:'radio', options:[
            {label:'Normal (Hb > 10 g/L)',value:0},{label:'Hb 6-10 g/L',value:1},{label:'Hb menor 6 g/L',value:2}
          ]},
          { id:'rpm', label:'Ruptura Prematura de Membranas', type:'radio', options:[
            {label:'Ninguna',value:0},{label:'Ruptura prematura de membranas',value:2},{label:'Ruptura prematura de membranas pretérmino',value:3}
          ]}
        ]
      }
    ];

    const initialValues = { edad:0, paridad:0, cardiopatia:0, otras_med:0, anemia:0, rpm:0 };

    // ── Componente principal ───────────────────────────────────────────────
    function CooplandCalculator() {
      const [values, setValues] = useState({ ...initialValues });
      const [patientData, setPatientData] = useState({
        unidad:'', fecha: new Date().toISOString().split('T')[0], peso:'', talla:''
      });
      const [isSubmitting, setIsSubmitting] = useState(false);
      const [submitStatus, setSubmitStatus] = useState(null);

      const toggleCheckbox = (id, value) =>
        setValues(prev => ({ ...prev, [id]: prev[id] ? undefined : value }));

      const handleRadio = (id, value) =>
        setValues(prev => ({ ...prev, [id]: value }));

      const handlePatientDataChange = (e) => {
        const { name, value } = e.target;
        setPatientData(prev => ({ ...prev, [name]: value }));
        if (submitStatus) setSubmitStatus(null);
      };

      const resetForm = () => {
        setValues({ ...initialValues });
        setPatientData(prev => ({ ...prev, peso:'', talla:'' }));
        setSubmitStatus(null);
        window.scrollTo({ top:0, behavior:'smooth' });
      };

      const imc = useMemo(() => {
        const p = parseFloat(patientData.peso);
        const t = parseFloat(patientData.talla);
        if (p > 0 && t > 0) {
          const h = t > 3 ? t / 100 : t;
          return (p / (h * h)).toFixed(1);
        }
        return '';
      }, [patientData.peso, patientData.talla]);

      const totalScore = useMemo(() => {
        let sum = 0;
        Object.values(values).forEach(v => { if (typeof v === 'number') sum += v; });
        return sum;
      }, [values]);

      const risk = useMemo(() => {
        if (totalScore <= 3) return { label:'Riesgo Bajo',      color:'text-green-700',  bg:'bg-green-100',  border:'border-green-500',  bar:'bg-green-500'  };
        if (totalScore <= 6) return { label:'Riesgo Moderado',  color:'text-yellow-700', bg:'bg-yellow-100', border:'border-yellow-500', bar:'bg-yellow-500' };
        return               { label:'Riesgo Alto',             color:'text-red-700',    bg:'bg-red-100',    border:'border-red-500',    bar:'bg-red-500'    };
      }, [totalScore]);

      const saveRecord = async () => {
        if (!patientData.unidad) {
          alert("Por favor, selecciona una Unidad Médica antes de guardar.");
          window.scrollTo({ top:0, behavior:'smooth' });
          return;
        }
        setIsSubmitting(true);
        setSubmitStatus(null);
        const formData = new URLSearchParams();
        formData.append(FORM_ENTRIES.unidad,  patientData.unidad);
        formData.append(FORM_ENTRIES.puntaje, totalScore.toString());
        formData.append(FORM_ENTRIES.riesgo,  risk.label);
        try {
          await fetch(GOOGLE_FORM_URL, {
            method:'POST', mode:'no-cors',
            headers:{'Content-Type':'application/x-www-form-urlencoded'},
            body: formData.toString()
          });
          setSubmitStatus('success');
          setTimeout(resetForm, 2500);
        } catch (err) {
          console.error(err);
          setSubmitStatus('error');
        } finally {
          setIsSubmitting(false);
        }
      };

      return (
        <div className="min-h-screen bg-slate-100 text-slate-800 font-sans pb-32 md:pb-10">

          {/* Header */}
          <header className="bg-[#005c5c] text-white p-5 shadow-lg border-b-4 border-[#004242]">
            <div className="max-w-6xl mx-auto">
              <div className="flex flex-col md:flex-row items-center md:items-start justify-between">
                <div className="flex items-center mb-4 md:mb-0">
                  <div className="bg-white p-2 rounded-full mr-4 shadow-sm">
                    <div className="w-10 h-10 bg-[#005c5c] rounded-full flex items-center justify-center">
                      <span className="text-white font-black text-xl">IMSS</span>
                    </div>
                  </div>
                  <div>
                    <h1 className="text-xl md:text-2xl font-bold leading-tight">Instituto Mexicano del Seguro Social</h1>
                    <p className="text-teal-100 text-sm font-medium">OOAD San Luis Potosí</p>
                    <p className="text-teal-100 text-xs mt-0.5 opacity-90">Jefatura de Servicios de Prestaciones Médicas</p>
                  </div>
                </div>
                <div className="text-center md:text-right">
                  <h2 className="text-lg font-bold bg-[#004242] px-4 py-2 rounded-lg inline-block shadow-inner">Índice de Coopland</h2>
                  <p className="text-xs text-teal-100 mt-2">Medición de Riesgo Obstétrico</p>
                </div>
              </div>
            </div>
          </header>

          <main className="max-w-6xl mx-auto p-4 md:p-6 grid grid-cols-1 md:grid-cols-12 gap-6 mt-2">

            {/* Columna principal */}
            <div className="md:col-span-8 space-y-6">

              {/* Ficha */}
              <section className="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden">
                <div className="bg-[#f0f7f7] p-4 border-b border-[#005c5c]/10 flex items-center">
                  <Ico name="Building2" size={20} className="text-[#005c5c] mr-3" />
                  <h2 className="text-lg font-bold text-[#005c5c]">Datos de Evaluación</h2>
                </div>
                <div className="p-5 grid grid-cols-1 sm:grid-cols-2 gap-4">
                  <div className="sm:col-span-2">
                    <label className="block text-sm font-semibold text-slate-700 mb-1">
                      Unidad Médica <span className="text-red-500">*</span>
                    </label>
                    <select name="unidad" value={patientData.unidad} onChange={handlePatientDataChange}
                      className={`w-full p-3 border ${patientData.unidad ? 'border-slate-300' : 'border-amber-300 ring-1 ring-amber-200'} rounded-lg focus:ring-2 focus:ring-[#005c5c] bg-slate-50`}>
                      <option value="">-- Seleccione una unidad para guardar --</option>
                      {unidadesMedicas.map((u,i) => <option key={i} value={u}>{u}</option>)}
                    </select>
                  </div>
                  <div>
                    <label className="block text-sm font-semibold text-slate-700 mb-1">Fecha</label>
                    <input type="date" name="fecha" value={patientData.fecha} onChange={handlePatientDataChange}
                      className="w-full p-2.5 border border-slate-300 rounded-lg focus:ring-2 focus:ring-[#005c5c] bg-slate-50" />
                  </div>
                  <div>
                    <label className="block text-sm font-semibold text-slate-700 mb-1">Peso (kg)</label>
                    <input type="number" name="peso" placeholder="Ej. 65" value={patientData.peso} onChange={handlePatientDataChange}
                      className="w-full p-2.5 border border-slate-300 rounded-lg focus:ring-2 focus:ring-[#005c5c] bg-slate-50" />
                  </div>
                  <div>
                    <label className="block text-sm font-semibold text-slate-700 mb-1">Talla (cm o m)</label>
                    <input type="number" step="0.01" name="talla" placeholder="Ej. 1.60 o 160" value={patientData.talla} onChange={handlePatientDataChange}
                      className="w-full p-2.5 border border-slate-300 rounded-lg focus:ring-2 focus:ring-[#005c5c] bg-slate-50" />
                  </div>
                  <div>
                    <label className="block text-sm font-semibold text-slate-700 mb-1">IMC</label>
                    <div className="w-full p-2.5 bg-slate-100 border border-slate-200 rounded-lg text-slate-700 font-bold">
                      {imc ? imc : '-'}
                    </div>
                  </div>
                </div>
              </section>

              {/* Secciones Coopland */}
              {sections.map((section, idx) => (
                <section key={idx} className="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden">
                  <div className="bg-[#f0f7f7] p-4 border-b border-[#005c5c]/10 flex items-center">
                    <Ico name={section.icon} size={20} className="text-[#005c5c] mr-3" />
                    <h2 className="text-lg font-bold text-[#005c5c]">{section.title}</h2>
                  </div>
                  <div className="p-5">
                    {section.items.map(item => (
                      <div key={item.id} className="mb-4 last:mb-0">
                        {item.type === 'radio' ? (
                          <div className="bg-slate-50 p-4 rounded-xl border border-slate-100">
                            <div className="font-semibold text-slate-700 mb-3">{item.label}</div>
                            <div className="grid grid-cols-1 sm:grid-cols-3 gap-2">
                              {item.options.map(opt => {
                                const sel = values[item.id] === opt.value;
                                return (
                                  <button key={opt.label} type="button" onClick={() => handleRadio(item.id, opt.value)}
                                    className={`flex flex-col items-start p-3 border rounded-xl transition-all duration-200 ${
                                      sel ? 'bg-teal-50 border-[#005c5c] shadow-sm ring-1 ring-[#005c5c]' : 'bg-white hover:bg-slate-100 border-slate-200'
                                    }`}>
                                    <span className={`font-medium text-sm text-left ${sel ? 'text-[#005c5c]' : 'text-slate-700'}`}>{opt.label}</span>
                                    <span className={`text-xs font-bold mt-1 ${sel ? 'text-teal-700' : 'text-slate-400'}`}>
                                      {opt.value === 0 ? '0 puntos' : `+${opt.value} pto${opt.value > 1 ? 's' : ''}`}
                                    </span>
                                  </button>
                                );
                              })}
                            </div>
                          </div>
                        ) : (
                          <button type="button" onClick={() => toggleCheckbox(item.id, item.value)}
                            className={`w-full flex items-center justify-between p-3.5 border rounded-xl transition-all duration-200 ${
                              values[item.id] ? 'bg-teal-50 border-[#005c5c] shadow-sm ring-1 ring-[#005c5c]' : 'bg-white hover:bg-slate-50 border-slate-200'
                            }`}>
                            <div className="flex items-center">
                              <div className={`w-5 h-5 rounded flex items-center justify-center border mr-3 transition-colors shrink-0 ${
                                values[item.id] ? 'bg-[#005c5c] border-[#005c5c]' : 'bg-white border-slate-300'
                              }`}>
                                {values[item.id] && <Ico name="Check" size={14} className="text-white" />}
                              </div>
                              <span className={`font-medium text-sm text-left ${values[item.id] ? 'text-[#005c5c]' : 'text-slate-700'}`}>{item.label}</span>
                            </div>
                            <span className={`text-sm font-bold whitespace-nowrap ml-4 ${values[item.id] ? 'text-teal-700' : 'text-slate-400'}`}>
                              +{item.value}
                            </span>
                          </button>
                        )}
                      </div>
                    ))}
                  </div>
                </section>
              ))}
            </div>

            {/* Sidebar sticky – Desktop */}
            <div className="md:col-span-4 hidden md:block">
              <div className="sticky top-6 bg-white p-6 rounded-2xl border border-slate-200 shadow-sm">
                <h3 className="text-lg font-bold mb-4 text-[#005c5c] flex items-center border-b pb-3">
                  <Ico name="Calculator" size={20} className="mr-2" /> Puntaje Total
                </h3>
                <div className="text-center mb-6 pt-2 pb-2">
                  <div className="text-7xl font-black mb-1 text-slate-800">{totalScore}</div>
                  <div className="text-slate-500 uppercase tracking-widest text-xs font-bold">Puntos Obtenidos</div>
                </div>
                <div className={`text-center py-4 rounded-xl font-bold mb-6 border-2 transition-colors duration-300 ${risk.bg} ${risk.color} ${risk.border}`}>
                  {risk.label}
                </div>
                <div className="text-xs text-slate-600 space-y-3 mb-6 bg-slate-50 border border-slate-100 p-4 rounded-xl">
                  {[['bg-green-500','Riesgo Bajo','0 - 3 pts'],['bg-yellow-500','Riesgo Moderado','4 - 6 pts'],['bg-red-500','Riesgo Alto','≥ 7 pts']].map(([c,l,r]) => (
                    <p key={l} className="flex justify-between items-center">
                      <span className="flex items-center"><span className={`w-3 h-3 rounded-full ${c} mr-2`}></span>{l}</span>
                      <span className="font-semibold text-slate-800 bg-white px-2 py-0.5 rounded border">{r}</span>
                    </p>
                  ))}
                </div>
                <div className="space-y-3">
                  <button onClick={saveRecord} disabled={isSubmitting}
                    className={`w-full py-3.5 font-bold rounded-xl transition-all flex items-center justify-center border shadow-sm ${
                      submitStatus === 'success' ? 'bg-green-600 text-white border-green-700' : 'bg-[#005c5c] hover:bg-[#004242] text-white border-[#004242]'
                    } disabled:opacity-70 disabled:cursor-not-allowed`}>
                    {isSubmitting
                      ? <span className="animate-pulse">Guardando...</span>
                      : submitStatus === 'success'
                        ? <><Ico name="CheckCircle2" size={20} className="mr-2" /> ¡Guardado!</>
                        : <><Ico name="Save" size={20} className="mr-2" /> Guardar Registro</>}
                  </button>
                  <button onClick={resetForm} disabled={isSubmitting}
                    className="w-full py-3 bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold rounded-xl transition-colors flex items-center justify-center border border-slate-200">
                    <Ico name="RotateCcw" size={16} className="mr-2" /> Limpiar Formulario
                  </button>
                </div>
              </div>
            </div>

          </main>

          {/* Panel flotante móvil */}
          <div className="fixed bottom-0 left-0 right-0 bg-white border-t border-slate-200 shadow-[0_-8px_20px_-10px_rgba(0,0,0,0.1)] md:hidden z-50">
            <div className={`h-1.5 w-full ${risk.bar}`}></div>
            <div className="p-3 flex justify-between items-center px-4">
              <div className="flex items-center">
                <div className={`w-12 h-12 flex items-center justify-center rounded-full font-black text-xl mr-3 border-2 ${risk.bg} ${risk.color} ${risk.border}`}>
                  {totalScore}
                </div>
                <div>
                  <div className="text-[10px] text-slate-500 font-bold uppercase tracking-wider">Resultado</div>
                  <div className={`font-bold ${risk.color}`}>{risk.label}</div>
                </div>
              </div>
              <div className="flex gap-2">
                <button onClick={resetForm} className="p-3 bg-slate-100 text-slate-600 rounded-xl border border-slate-200" aria-label="Reiniciar">
                  <Ico name="RotateCcw" size={20} />
                </button>
                <button onClick={saveRecord} disabled={isSubmitting}
                  className={`px-4 py-3 font-bold rounded-xl flex items-center ${
                    submitStatus === 'success' ? 'bg-green-600 text-white' : 'bg-[#005c5c] text-white'
                  }`}>
                  {isSubmitting ? '...' : submitStatus === 'success'
                    ? <Ico name="CheckCircle2" size={20} />
                    : <Ico name="Save" size={20} />}
                </button>
              </div>
            </div>
          </div>

        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<CooplandCalculator />);
  </script>
</body>
</html>
